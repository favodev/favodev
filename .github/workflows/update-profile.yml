name: Update profile stats

# Redibuja los SVG del README con las contribuciones actuales.
# Corre todos los días a las 07:23 UTC y también se puede lanzar a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_profile.py "${{ github.repository_owner }}" assets

      - name: Commit if something changed
        run: |
          if git diff --quiet -- assets; then
            echo "Sin cambios, no hay nada que subir."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Update profile stats"
          git push
